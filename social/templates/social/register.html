<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - CodeAlpha Social Media</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f4f6; margin: 30px; }
        .card { max-width: 450px; margin: auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); }
        .btn { background: #2563eb; color: #fff; padding: 10px 16px; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
<div class="card">
    <h2>Create an Account</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Sign Up</button>
    </form>
    <p><a href="{% url 'post_list' %}">&larr; Back to Feed</a></p>
</div>
</body>
</html>
